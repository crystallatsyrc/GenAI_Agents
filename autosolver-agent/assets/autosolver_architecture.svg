<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#08111f"/>
      <stop offset="0.55" stop-color="#111827"/>
      <stop offset="1" stop-color="#182235"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" x2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" x2="1">
      <stop offset="0" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#f97316"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <style>
      .title{font:700 54px Inter,Segoe UI,Arial,sans-serif;fill:#f8fafc}
      .sub{font:400 24px Inter,Segoe UI,Arial,sans-serif;fill:#a7b3c7}
      .label{font:700 25px Inter,Segoe UI,Arial,sans-serif;fill:#f8fafc}
      .small{font:400 18px Inter,Segoe UI,Arial,sans-serif;fill:#b9c4d6}
      .tiny{font:600 15px Inter,Segoe UI,Arial,sans-serif;fill:#dbeafe}
      .box{fill:#121c2e;stroke:#334155;stroke-width:2;rx:28;filter:url(#shadow)}
      .inner{fill:#18253a;stroke:#3b4a63;stroke-width:1.5;rx:18}
      .line{stroke:#60a5fa;stroke-width:4;fill:none;stroke-linecap:round}
      .dash{stroke:#64748b;stroke-width:2;stroke-dasharray:7 8;fill:none}
    </style>
    <marker id="arrow" markerWidth="13" markerHeight="13" refX="9" refY="6" orient="auto">
      <path d="M0,0 L10,6 L0,12 Z" fill="#60a5fa"/>
    </marker>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1380" cy="130" r="210" fill="#0ea5e9" opacity="0.08"/>
  <circle cx="190" cy="790" r="240" fill="#f59e0b" opacity="0.08"/>
  <text x="90" y="105" class="title">AutoSolver Agent</text>
  <text x="92" y="145" class="sub">Budgeted strategy search for courier assignment under stochastic acceptance</text>
  <rect x="82" y="210" width="270" height="168" class="box"/>
  <text x="112" y="262" class="label">Candidate Table</text>
  <text x="112" y="306" class="small">packages</text>
  <text x="112" y="334" class="small">couriers</text>
  <text x="112" y="362" class="small">score + willingness</text>
  <rect x="428" y="180" width="320" height="230" class="box"/>
  <text x="462" y="236" class="label">State Builder</text>
  <rect x="462" y="270" width="248" height="42" class="inner"/>
  <text x="482" y="298" class="small">task bit masks</text>
  <rect x="462" y="326" width="248" height="42" class="inner"/>
  <text x="482" y="354" class="small">package lookup</text>
  <rect x="462" y="382" width="248" height="42" class="inner"/>
  <text x="482" y="410" class="small">case profile</text>
  <rect x="845" y="150" width="425" height="315" class="box"/>
  <text x="885" y="210" class="label">Strategy Portfolio</text>
  <rect x="884" y="246" width="165" height="46" class="inner"/>
  <text x="904" y="276" class="small">greedy repair</text>
  <rect x="1085" y="246" width="210" height="46" class="inner"/>
  <text x="1105" y="276" class="small">package savings</text>
  <rect x="884" y="314" width="186" height="46" class="inner"/>
  <text x="904" y="344" class="small">partition beam</text>
  <rect x="1104" y="314" width="190" height="46" class="inner"/>
  <text x="1124" y="344" class="small">row beam</text>
  <rect x="884" y="382" width="214" height="46" class="inner"/>
  <text x="904" y="412" class="small">fanout search</text>
  <rect x="1128" y="382" width="164" height="46" class="inner"/>
  <text x="1148" y="412" class="small">local exchange</text>
  <rect x="430" y="550" width="370" height="200" class="box"/>
  <text x="466" y="610" class="label">Unified Evaluator</text>
  <text x="466" y="654" class="small">coverage first</text>
  <text x="466" y="684" class="small">expected cost second</text>
  <text x="466" y="714" class="small">guard stale observations</text>
  <rect x="930" y="555" width="335" height="190" class="box"/>
  <text x="966" y="615" class="label">Incumbent Plan</text>
  <text x="966" y="660" class="small">best assignment so far</text>
  <text x="966" y="690" class="small">single-file output</text>
  <text x="966" y="720" class="small">deadline safe</text>
  <path d="M352 294 C382 294 395 294 428 294" class="line" marker-end="url(#arrow)"/>
  <path d="M748 294 C785 294 810 294 845 294" class="line" marker-end="url(#arrow)"/>
  <path d="M1060 466 C1035 520 930 570 800 630" class="line" marker-end="url(#arrow)"/>
  <path d="M800 650 C865 650 890 650 930 650" class="line" marker-end="url(#arrow)"/>
  <path d="M1040 555 C980 500 920 470 850 440" class="dash" marker-end="url(#arrow)"/>
  <rect x="1320" y="604" width="170" height="66" rx="18" fill="url(#cyan)" opacity="0.95"/>
  <text x="1350" y="644" class="tiny">solve(input_text)</text>
  <path d="M1265 650 C1290 650 1300 645 1320 637" class="line" marker-end="url(#arrow)"/>
  <rect x="108" y="760" width="310" height="50" rx="16" fill="#0f172a" stroke="#334155"/>
  <text x="128" y="792" class="tiny">No network calls. No external model calls. One uploadable Python file.</text>
</svg>
